<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glowstep Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#0C0A24;color:#F6F3FF;font:16px/1.45 Rubik,system-ui,sans-serif}
  form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;padding:28px;border-radius:20px;background:#151036;border:1px solid rgba(179,172,221,.18)}
  h1{margin:0;font:400 30px Bungee,Impact,sans-serif} h1 span{color:#FFD23F}
  p{margin:0;color:#B3ACDD;font-size:14px}
  label{font-size:13px;font-weight:600;color:#B3ACDD}
  input{width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1px solid rgba(179,172,221,.3);background:#0C0A24;color:inherit;font:inherit}
  button{padding:12px;border-radius:12px;border:0;background:#FF3D8B;color:#1a0610;font:600 16px Rubik,system-ui,sans-serif;cursor:pointer}
  :focus-visible{outline:3px solid #FFD23F;outline-offset:2px}
  #err{color:#F87171;font-size:14px;min-height:1.4em}
</style>
</head>
<body>
<form id="f">
  <h1>GLOW<span>STEP</span></h1>
  <p>Enter the admin password to manage songs and control the stage screen.</p>
  <label for="pw">Password<input id="pw" type="password" autocomplete="current-password" required autofocus></label>
  <button type="submit">Log in</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
  if (r.ok) location.href = '/admin'; else document.getElementById('err').textContent = (await r.json().catch(() => ({}))).error || 'Login failed.';
};
</script>
</body>
</html>
