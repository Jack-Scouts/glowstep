<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Glowstep Screen</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#0C0A24;color:#F6F3FF;font:18px/1.5 Rubik,system-ui,sans-serif;text-align:center}
  main{max-width:520px;display:flex;flex-direction:column;gap:14px;align-items:center}
  h1{margin:0;font:400 clamp(34px,6vw,64px) Bungee,Impact,sans-serif} h1 span{color:#FFD23F}
  p{margin:0;color:#B3ACDD}
  a{color:#27D9F5;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>GLOW<span>STEP</span></h1>
  <p>This screen isn't linked yet. In the admin, copy the <b>screen link</b> and open it on this computer. You only need to do it once.</p>
  <p><a href="/login?next=/screen">Log in to the admin instead</a></p>
</main>
</body>
</html>
