<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C0A24">
<title>Glowstep Vote</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{color-scheme:dark;--bg:#0C0A24;--panel:#151036;--panel2:#1C1645;--line:rgba(179,172,221,.18);--ink:#F6F3FF;--muted:#B3ACDD;--dim:#8680B5;
  --pink:#FF3D8B;--cyan:#27D9F5;--sun:#FFD23F;--violet:#8B5CF6;--good:#4ADE80;--bad:#F87171;
  --display:"Bungee",Impact,"Arial Black",sans-serif;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 90px)}
.brand{font-family:var(--display);font-size:20px} .brand span{color:var(--sun)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.05;margin:14px 0 8px}
h1 em{font-style:normal;color:var(--pink)}
.sub{margin:0 0 18px;color:var(--muted);font-size:15px}
.np{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.np div{padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0}
.np .now{border-color:rgba(255,61,139,.55);background:linear-gradient(135deg,rgba(255,61,139,.16),rgba(139,92,246,.1))}
.np small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.np .now small{color:var(--pink)}
.np b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np ol{list-style:none;margin:0;padding:0;font-size:14px}
.np ol li{display:block;padding:0;background:none;border:0;border-radius:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np ol li:first-child{font-weight:600;font-size:16px}
.np .none{color:var(--dim);font-size:14px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:10px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
li.top{border-color:rgba(255,210,63,.5)}
.rank{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:14px;background:var(--panel2);color:var(--muted)}
li.top .rank{background:var(--sun);color:#1a1405}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.info .mine{color:var(--cyan);font-weight:600}
.flag{font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.flag.playing{background:rgba(255,61,139,.2);color:var(--pink)} .flag.queued{background:rgba(39,217,245,.16);color:var(--cyan)}
.vote{flex:none;min-width:84px;min-height:46px;padding:0 16px;border-radius:12px;border:0;background:var(--pink);color:#1a0610;font-weight:800;font-size:15px;cursor:pointer;transition:transform .08s}
.vote:active:not(:disabled){transform:scale(.95)}
.vote:disabled{background:var(--panel2);color:var(--dim);cursor:not-allowed}
.vote.done{background:rgba(74,222,128,.16);color:var(--good)}
.closed{text-align:center;padding:60px 10px}
.closed b{display:block;font-family:var(--display);font-weight:400;font-size:28px;margin-bottom:10px}
.closed p{color:var(--muted);margin:0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);padding:12px 18px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center;z-index:5}
#toast.good{background:var(--good);color:#06240f}
</style>
</head>
<body>
<main>
  <div class="brand">GLOW<span>STEP</span></div>
  <section id="closed" class="closed" hidden>
    <b>Voting is closed</b>
    <p>Keep this page open. It will open up as soon as voting starts.</p>
  </section>
  <section id="open" hidden>
    <h1>Pick the <em>next song!</em></h1>
    <p class="sub" id="sub"></p>
    <div class="np" id="np" hidden>
      <div class="now"><small>NOW PLAYING</small><b id="npNow"></b></div>
      <div><small>UP NEXT</small><ol id="npNext"></ol><span class="none" id="npNone">Your votes decide!</span></div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Search songs" aria-label="Search songs" autocomplete="off">
      <span class="seg" role="group" aria-label="Sort"><button data-sort="top" class="on">Top</button><button data-sort="az">A–Z</button></span>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="none" hidden>No songs match that search.</p>
  </section>
</main>
<div id="toast" role="status" hidden></div>
<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let b = { on: false, songs: [] }, mine = {}, until = 0, sort = 'top', busy = false, order = [], touchedAt = 0;

let toastT;
function toast(msg, good) { const t = $('#toast'); t.textContent = msg; t.className = good ? 'good' : ''; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2500); }

function render() {
  $('#closed').hidden = b.on; $('#open').hidden = !b.on; if (!b.on) return;
  $('#sub').textContent = b.repeat ? 'Tap Vote for the songs you want. You can vote again every 5 seconds, as often as you like.' : 'Tap Vote for the songs you want. One vote per song.';
  // what's on and what's coming, so people can see their votes working
  $('#np').hidden = !b.now && !b.next?.length;
  $('#npNow').textContent = b.now || 'Between songs';
  $('#npNext').innerHTML = (b.next || []).map(t => `<li>${esc(t)}</li>`).join(''); $('#npNone').hidden = !!b.next?.length;
  // votes for a song are cleared once it plays, so drop our own count too
  for (const s of b.songs) if (!s.votes) delete mine[s.id];
  const ranked = [...b.songs].filter(s => s.votes).sort((x, y) => y.votes - x.votes), rankOf = new Map(ranked.map((s, i) => [s.id, i + 1]));
  const q = $('#q').value.trim().toLowerCase();
  let list = b.songs.filter(s => !q || s.title.toLowerCase().includes(q));
  list.sort(sort === 'top' ? (x, y) => y.votes - x.votes || x.title.localeCompare(y.title) : (x, y) => x.title.localeCompare(y.title));
  // Don't let live votes reshuffle the list right under someone's thumb.
  if (Date.now() - touchedAt < 2500 && order.length) { const at = id => { const i = order.indexOf(id); return i < 0 ? 1e9 : i; }; list.sort((x, y) => at(x.id) - at(y.id)); }
  order = list.map(s => s.id);
  const wait = Math.max(0, Math.ceil((until - Date.now()) / 1000));
  $('#list').innerHTML = list.map(s => {
    const r = rankOf.get(s.id), m = mine[s.id] || 0, playing = s.flag === 'playing', once = !b.repeat && m;
    const label = playing ? 'On now' : once ? 'Voted ✓' : wait ? `${wait}s` : 'Vote';
    return `<li class="${r && r <= 3 ? 'top' : ''}">
      <span class="rank">${r ? '#' + r : '–'}</span>
      <span class="info"><b>${esc(s.title)}</b><span>${s.votes} vote${s.votes === 1 ? '' : 's'}${m ? ` · <span class="mine">you: ${m}</span>` : ''}${s.flag ? `<span class="flag ${s.flag}">${playing ? 'ON NOW' : 'IN THE QUEUE'}</span>` : ''}</span></span>
      <button class="vote ${once ? 'done' : ''}" data-id="${s.id}" ${playing || once || wait ? 'disabled' : ''} aria-label="Vote for ${esc(s.title)}">${label}</button>
    </li>`;
  }).join('');
  $('#none').hidden = list.length > 0 || !b.songs.length;
  if (!b.songs.length) $('#list').innerHTML = '<p class="empty">No songs yet. Check back soon!</p>';
}

$('#list').onclick = async e => {
  const bt = e.target.closest('button.vote'); if (!bt || bt.disabled || busy) return;
  busy = true; const id = bt.dataset.id;
  try {
    const r = await fetch('/api/vote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ songId: id }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) {
      mine[id] = d.mine; until = Date.now() + (d.wait || 0);
      const s = b.songs.find(x => x.id === id); if (s) s.votes = d.votes;
      toast(`Vote counted for “${s?.title || 'that song'}”!`, true); navigator.vibrate?.(30);
    } else { if (d.wait) until = Date.now() + d.wait; toast(d.error || 'That vote did not count. Try again.'); }
  } catch (err) { toast('No connection. Try again in a moment.'); }
  busy = false; render();
};
$('#q').oninput = render;
addEventListener('pointerdown', () => touchedAt = Date.now(), true);
addEventListener('scroll', () => touchedAt = Date.now(), { passive: true });
document.querySelectorAll('[data-sort]').forEach(bt => bt.onclick = () => { sort = bt.dataset.sort; document.querySelectorAll('[data-sort]').forEach(x => x.classList.toggle('on', x === bt)); render(); });
// tick the "vote again in Ns" countdown
setInterval(() => { if (until && Date.now() < until + 1000) render(); }, 1000);

fetch('/api/vote').then(r => r.json()).then(d => { mine = d.mine || {}; b = d; render(); }).catch(() => {});
const socket = io({ query: { role: 'vote' } });
socket.on('votes', d => { b = d; render(); });
})();
</script>
</body>
</html>
